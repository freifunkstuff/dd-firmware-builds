name: Build experimental DD device firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device ID or all (see devices/*.json)"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  devices:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          echo "matrix=$(python3 scripts/list_devices.py --only "$DEVICE")" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests -v

  build:
    needs: devices
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.matrix) }}
    # Public hosted runners may not have sufficient FREE disk; use an org runner
    # with >= 25 GiB free by setting repository variable FFDD_RUNNER if needed.
    runs-on: ${{ vars.FFDD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disposable runner space and refuse low-disk builds
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
            docker image prune -af || true
          fi
          df -h .
          available_kib=$(df -Pk . | awk 'END {print $4}')
          if (( available_kib < 20 * 1024 * 1024 )); then
            echo "Need >=20 GiB free to attempt DD build; configure FFDD_RUNNER for a larger/self-hosted runner." >&2
            exit 1
          fi

      - name: Install OpenWrt/FFDD host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc-multilib clang cmake file git gawk flex bison gettext libncurses-dev \
            libssl-dev zlib1g-dev libelf-dev libcap-dev libusb-1.0-0-dev \
            unzip zip rsync jq patch python3 python3-setuptools python3-pyelftools \
            squashfs-tools bc swig time wget curl lzop zstd subversion pkgconf

      - name: Fetch reviewed official Dresden tag
        shell: bash
        run: |
          set -euo pipefail
          repo=$(python3 -c 'import json; print(json.load(open("upstream.json"))["repository"])')
          tag=$(python3 -c 'import json; print(json.load(open("upstream.json"))["tag"])')
          git clone --depth=1 --branch "$tag" "$repo" source
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          x=json.loads(Path('upstream.json').read_text())
          def git(*args):return subprocess.check_output(['git','-C','source',*args],text=True).strip()
          assert git('rev-parse','HEAD')==x['commit_sha'], 'reviewed FFDD commit SHA mismatch'
          assert git('rev-parse','refs/tags/'+x['tag'])==x['tag_object_sha'], 'reviewed annotated tag SHA mismatch'
          print('official FFDD release',x['tag'],x['commit_sha'])
          PY

      - name: Prepare only selected device from official DD source
        id: prepare
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          target=$(python3 scripts/prepare.py --source source --device "$DEVICE")
          echo "target=$target" >> "$GITHUB_OUTPUT"
          (cd source && ./build.sh devices "$target")

      - name: Build with Dresden GitHub repository settings
        id: compile
        shell: bash
        env:
          TARGET: ${{ steps.prepare.outputs.target }}
          FF_MESH_KEY: ${{ secrets.FF_MESH_KEY }}
          FF_REGISTERKEY_PREFIX: ${{ secrets.FF_REGISTERKEY_PREFIX }}
        run: |
          set -euo pipefail
          if [ -z "${FF_MESH_KEY:-}" ] || [ -z "${FF_REGISTERKEY_PREFIX:-}" ]; then
            echo 'Required FFDD build parameters are not configured.' >&2
            exit 1
          fi
          echo "::add-mask::${FF_REGISTERKEY_PREFIX//_/:}"
          (cd source && ./build.sh "$TARGET" -- -j2 V=s) > build.log 2>&1 || {
            python3 scripts/redact_log.py build.log build-redacted.log
            tail -n 110 build-redacted.log
            exit 1
          }
          if ! grep -q 'make ret: 0' build.log; then
            python3 scripts/redact_log.py build.log build-redacted.log
            echo 'DD builder did not confirm a successful make' >&2
            exit 1
          fi
          df -h .

      - name: Verify factory, sysupgrade, filesystem, firmware and provenance
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          FF_MESH_KEY: ${{ secrets.FF_MESH_KEY }}
          FF_REGISTERKEY_PREFIX: ${{ secrets.FF_REGISTERKEY_PREFIX }}
        run: |
          set -euo pipefail
          python3 scripts/verify_images.py --source source --device "$DEVICE" --out dist/"$DEVICE"
          (cd dist/"$DEVICE" && sha256sum -c SHA256SUMS)

      - name: Upload UNTESTED lab images, not a GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: UNTESTED-dd-${{ matrix.device }}-${{ github.run_number }}
          path: dist/${{ matrix.device }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload redacted diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dd-build-log-${{ matrix.device }}-${{ github.run_number }}
          path: build-redacted.log
          if-no-files-found: ignore
          retention-days: 3
